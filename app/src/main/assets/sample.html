<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#8F0010;
 font-family:"Montserrat","Open Sans",sans-serif;color:#F1E6C8}
.L{position:absolute;transform-origin:center;display:none}
.t{align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:150px;line-height:1}
</style></head><body><div id="stage"></div><script>
const cl=(v,a,b)=>Math.min(b,Math.max(a,v)),ez=x=>1-Math.pow(1-cl(x,0,1),3);
window.RAW={duration:6,width:1920,height:1080,fps:30,
 layers:[
  {id:"ghost",name:"Ghost",type:"text",x:-100,y:200,w:2100,h:700,opacity:0.12,z:1,start:0,end:6,text:"RAW",src:null},
  {id:"title",name:"Title",type:"text",x:160,y:330,w:1600,h:220,opacity:1,z:5,start:0,end:6,text:"RAW EDIT TEST",src:null},
  {id:"sub",name:"Sub",type:"text",x:260,y:620,w:1400,h:100,opacity:1,z:6,start:1,end:6,text:"Simple. Fast. Free.",src:null}],
 anim:{
  ghost:t=>({dx:-t*30,dy:0,scale:1,rotate:0,opacity:1}),
  title:t=>({dx:0,dy:(1-ez(t/0.7))*140,scale:0.85+0.15*ez(t/0.7),rotate:(1-ez(t/0.7))*-4,opacity:ez(t/0.4)}),
  sub:t=>({dx:(1-ez(t/0.6))*240,dy:0,scale:1,rotate:0,opacity:ez(t/0.5)})},
 seek(t){const s=document.getElementById("stage");
  for(const l of this.layers){let e=document.getElementById("L_"+l.id);
   if(!e){e=document.createElement("div");e.id="L_"+l.id;e.className="L"+(l.type==="text"?" t":"");
    if(l.type==="image"){const i=document.createElement("img");i.style.cssText="width:100%;height:100%;object-fit:contain";e.appendChild(i)}
    s.appendChild(e)}
   if(l.type==="text")e.textContent=l.text||"";
   if(l.type==="image"){const i=e.firstChild;if(i.getAttribute("src")!==l.src)i.setAttribute("src",l.src||"")}
   const v=t>=l.start&&t<=l.end,a=(this.anim[l.id]?this.anim[l.id](t-l.start):{})||{};
   const sc=a.scale==null?1:a.scale,op=a.opacity==null?1:a.opacity;
   e.style.display=v?(l.type==="text"?"flex":"block"):"none";
   e.style.left=l.x+"px";e.style.top=l.y+"px";e.style.width=l.w+"px";e.style.height=l.h+"px";
   e.style.zIndex=l.z;e.style.opacity=cl(l.opacity*op,0,1);
   e.style.transform=`translate(${a.dx||0}px,${a.dy||0}px) scale(${sc}) rotate(${a.rotate||0}deg)`}}};
RAW.seek(0);</script></body></html>
